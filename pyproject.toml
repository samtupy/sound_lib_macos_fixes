[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sound_lib"
version = "0.8.8"
description = "Pythonic wrapper to the Bass sound library and various add-ons"
authors = [
    {name = "Christopher Toth", email = "q@q-continuum.net"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/q-continuum/sound_lib"
Issues = "https://github.com/q-continuum/sound_lib/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sound_lib*"]

[tool.setuptools.package-data]
sound_lib = [
    "lib/windows_x86/*",
    "lib/windows_x64/*",
    "lib/linux_x64/*",
    "lib/linux_x86/*",
    "lib/linux_aarch64/*",
    "lib/linux_armhf/*",
    "lib/macos/*",
    "lib/android_arm64-v8a/*",
    "lib/android_armeabi-v7a/*",
    "lib/android_x86/*",
    "lib/android_x64/*",
    "lib/iphoneos/*",
    "lib/iphonesimulator/*",
]

[dependency-groups]
dev = [
    "mypy>=1.4.1",
    "pyright>=1.1.406",
    "pytest>=7.4.4",
    "ruff>=0.14.0",
]
